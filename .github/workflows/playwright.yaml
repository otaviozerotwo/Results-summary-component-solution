name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_env:
        description: E2E testing environment
        required: true
        default: local
        type: choice
        options:
          - local
          - production

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      TEST_ENV: ${{ inputs.test_env || 'local' }}
      E2E_BASE_URL: http://localhost:5173/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Configure production URL
        if: env.TEST_ENV == 'production'
        env:
          PRODUCTION_URL: ${{ vars.E2E_BASE_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::Define the E2E_BASE_URL variable in the Actions Variables of the repository."
            exit 1
          fi
          echo "E2E_BASE_URL=$PRODUCTION_URL" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ env.TEST_ENV }}
          path: playwright-report/
          retention-days: 30
